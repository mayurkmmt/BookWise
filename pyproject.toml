[project]
name = "bookwise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crispy-bootstrap5>=2026.3",
    "django>=5.2.17",
    "django-auditlog>=3.4.1",
    "django-crispy-forms>=2.7",
    "django-phonenumber-field>=8.5.0",
    "gunicorn>=26.0.0",
    "phonenumbers>=9.0.36",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pytest-django>=4.13.0",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]
