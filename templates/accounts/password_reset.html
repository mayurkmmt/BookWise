{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<section class="container my-5" aria-labelledby="reset-heading">
    <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="p-5 text-center bg-light border-bottom">
                    <div class="bg-white rounded-circle d-inline-flex justify-content-center align-items-center shadow-sm mb-3"
                        style="width: 70px; height: 70px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                            class="bi bi-key text-primary" viewBox="0 0 16 16">
                            <path
                                d="M0 8a4 4 0 0 1 7.465-2H14a.5.5 0 0 1 .354.146l1.5 1.5a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0L13 9.207l-.646.647a.5.5 0 0 1-.708 0L11 9.207l-.646.647a.5.5 0 0 1-.708 0L9 9.207l-.646.647A.5.5 0 0 1 8 10h-.535A4 4 0 0 1 0 8zm4-3a3 3 0 1 0 2.712 4.285A.5.5 0 0 1 7.163 9h.63l.853-.854a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.793-.793-1-1h-6.63a.5.5 0 0 1-.451-.285A3 3 0 0 0 4 5z" />
                            <path d="M4 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" />
                        </svg>
                    </div>
                    <h3 id="reset-heading" class="card-title fw-bold font-poppins text-dark m-0">Reset Password</h3>
                </div>
                <div class="p-5 bg-white">
                    <p class="text-muted mb-4 text-center">Forgot your password? No problem. Just enter the email
                        address you signed up with and we will email you a secure reset link.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit"
                            class="btn btn-primary btn-lg w-100 rounded-pill mt-4 shadow-sm fw-bold bg-gradient">Send
                            Reset Email</button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="text-decoration-none text-muted fw-medium"><svg
                                xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-arrow-left me-1" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z" />
                            </svg>Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</section>
{% endblock %}
