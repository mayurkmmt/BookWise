<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background-color: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e9ecef; }
        .header { background-color: #0f2027; color: white; padding: 25px; text-align: center; border-bottom: 4px solid #203a43; }
        .header h2 { margin: 0; font-weight: 600; font-size: 24px; letter-spacing: 0.5px; }
        .content { padding: 30px; line-height: 1.6; text-align: center; }
        .otp-box { background-color: #f8f9fa; border: 2px dashed #0f2027; border-radius: 8px; padding: 20px; margin: 30px auto; max-width: 300px; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #0f2027; }
        .footer { background-color: #f1f3f5; color: #6c757d; padding: 15px; text-align: center; font-size: 13px; border-top: 1px solid #e9ecef;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>BookWise Verification</h2>
        </div>
        <div class="content">
            <p style="font-size: 16px; margin-bottom: 5px;">{{ preheader_message }}</p>
            <p style="font-size: 15px; color: #666; margin-top: 0;">Please use the following 6-digit code to complete your secure action.</p>

            <div class="otp-box">
                {{ otp }}
            </div>

            <p style="font-size: 14px; color: #777;">This code is uniquely generated and valid for a limited time. Do not share this code with anyone.</p>
        </div>
        <div class="footer">
            &copy; 2026 BookWise Solutions. All rights reserved.
        </div>
    </div>
</body>
</html>
