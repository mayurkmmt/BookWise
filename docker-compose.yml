services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=db_bookwise
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_bookwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # Mount the current directory to /app in the container for live-reloading changes
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the DB_HOST from .env so the web container attempts to connect to the 'db' container
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
